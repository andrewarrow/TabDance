name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check runner and Xcode
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version

      - name: Run tests
        run: >-
          xcodebuild -project TabDance.xcodeproj -scheme TabDance
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath .build/xcode -skipPackagePluginValidation
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES test

      - name: Build app
        run: ./build-app.sh ARCHS=arm64 ONLY_ACTIVE_ARCH=NO

      - name: Verify app architecture and signature
        run: |
          test "$(lipo -archs dist/TabDance.app/Contents/MacOS/TerminalLab)" = arm64
          codesign --verify --deep --strict dist/TabDance.app

      - name: Create DMG
        run: |
          staging="$RUNNER_TEMP/tabdance-dmg"
          mkdir -p "$staging"
          ditto dist/TabDance.app "$staging/TabDance.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname TabDance -srcfolder "$staging" \
            -ov -format UDZO dist/TabDance-macos-arm64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: TabDance-macos-arm64
          path: dist/TabDance-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TabDance-macos-arm64

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAG_NAME="${COMMIT_SHA:0:8}"
          sha256sum TabDance-macos-arm64.dmg > SHA256SUMS
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" TabDance-macos-arm64.dmg SHA256SUMS --clobber
          else
            gh release create "$TAG_NAME" TabDance-macos-arm64.dmg SHA256SUMS \
              --title "$TAG_NAME" --target "$COMMIT_SHA" --generate-notes
          fi
